# git commit 実行時に自動で format → typecheck → lint を実行する
# https://lefthook.dev

pre-commit:
  piped: true  # 前のコマンドが失敗したら後続をスキップ（typecheck 失敗時に lint を実行しない）
  commands:
    format:
      priority: 1
      stage_fixed: true  # format が書き換えたファイルを自動で再ステージング
      run: docker compose exec -T web pnpm format
    typecheck:
      priority: 2
      run: docker compose exec -T web pnpm typecheck
    lint:
      priority: 3
      run: docker compose exec -T web pnpm lint
