name: tabiji                                                  # Compose プロジェクト名を固定（ディレクトリ名に依存させない。ボリューム接頭辞 tabiji_ もここから決まる）

services:
  # Next.js（フロント＋バックエンド）
  web:
    build:
      context: ./web                                          # ビルドコンテキスト（Dockerfileがあるディレクトリ）
      dockerfile: Dockerfile
    container_name: tabiji-web
    environment:
      - NODE_ENV=development                                  # 開発モードで起動
      - DATABASE_URL=postgresql://postgres_user:postgres_pass@db:5432/postgres_db  # DB接続URL（本番はNeonのURLに差し替え）
    ports:                                                    # ポートマッピング（ホスト側:コンテナ側）
      - "3000:3000"                                           # localhost:3000でアクセス可能
      - "127.0.0.1:4983:4983"                                 # Drizzle Studio（pnpm db:studio）ローカル開発のみ
    volumes:
      - ./web:/app                                            # ソースコードをマウント（ホットリロード用）
      - /app/node_modules                                     # anonymous volumeでnode_modulesを保護（named volumeと異なりdocker compose down時に削除される）
    depends_on:
      db:
        condition: service_healthy                            # dbのhealthcheckがOKになるまで起動しない
    stdin_open: true                                          # コンテナにアタッチしてデバッグできるようにする
    tty: true                                                 # 同上

  db:
    image: postgres:17-alpine
    container_name: tabiji-db
    environment:
      - POSTGRES_DB=postgres_db                               # 作成されるデータベース名
      - POSTGRES_USER=postgres_user                           # PostgreSQLのユーザー名
      - POSTGRES_PASSWORD=postgres_pass                       # PostgreSQLのパスワード
    ports:                                                    # ポートマッピング（ホスト側:コンテナ側）
      - "5432:5432"                                           # localhost:5432でアクセス可能
    volumes:
      - pgdata:/var/lib/postgresql/data                       # データ永続化（docker compose downでは消えない）
    healthcheck:                                              # ヘルスチェック（webコンテナのdepends_on.conditionで使用）
      test: ["CMD-SHELL", "pg_isready -U postgres_user"]      # DBが接続可能か確認するコマンド
      interval: 5s                                            # チェック間隔
      timeout: 3s                                             # タイムアウト
      retries: 5                                              # 失敗許容回数（超えるとunhealthy）
    restart: unless-stopped                                   # 異常終了時に自動再起動

volumes:
  pgdata:                                                     # PostgreSQLのデータを保存するボリューム
